plugins {
    id 'com.android.application'
}

android {
    namespace 'net.doinu.kid'
    compileSdk 34

    defaultConfig {
        applicationId 'net.doinu.kid'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.3'
    }

    signingConfigs {
        release {
            storeFile file('../doinu-release.keystore')
            storePassword 'doinu-kid-2026'
            keyAlias 'doinu'
            keyPassword 'doinu-kid-2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*']
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
